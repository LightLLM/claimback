<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">ClaimBack architecture</title><desc id="desc">The web recovery desk calls a Strands agent with six guarded tools. Human decisions use a separate endpoint. Local state and evidence are persisted in SQLite. A verified AgentCore runtime hosts the cloud agent entrypoint.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6" fill="none" stroke="#78936a" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#214637}.title{font-size:34px;font-weight:bold}.sub{font-size:16px;fill:#7a8972}.head{font-size:20px;font-weight:bold}.body{font-size:15px;fill:#657c5c}.cap{font-size:12px;letter-spacing:2px;fill:#7f946e}.box{fill:#fff;stroke:#dbe4d2;stroke-width:2}.line{fill:none;stroke:#78936a;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1440" height="850" fill="#f7f9f2"/><text x="60" y="65" class="title">ClaimBack.</text><text x="60" y="98" class="sub">The agent does the legwork. The human keeps the final say.</text><text x="60" y="151" class="cap">SHIPPED LOCAL MVP</text>
<rect x="60" y="180" width="250" height="120" rx="18" class="box"/><text x="85" y="218" class="head">Recovery desk</text><text x="85" y="247" class="body">Cases · decisions · evidence</text><text x="85" y="272" class="body">Responsive browser UI</text>
<rect x="370" y="180" width="280" height="120" rx="18" class="box"/><text x="395" y="218" class="head">FastAPI + session boundary</text><text x="395" y="247" class="body">Scoped routine authorization</text><text x="395" y="272" class="body">Revision-checked persistence</text>
<rect x="710" y="180" width="300" height="120" rx="18" fill="#1d5241"/><text x="735" y="218" class="head" style="fill:#fff">Strands Agent</text><text x="735" y="247" class="body" style="fill:#d1e6b8">Scripted demo OR Bedrock model</text><text x="735" y="272" class="body" style="fill:#d1e6b8">Sequential, bounded tool loop</text>
<path d="M310 240H365M650 240H705" class="line"/>
<rect x="1080" y="180" width="300" height="120" rx="18" class="box"/><text x="1105" y="218" class="head">Guarded tools</text><text x="1105" y="247" class="body">Gather · assess · draft · submit</text><text x="1105" y="272" class="body">Monitor · follow up</text><path d="M1010 240H1075" class="line"/>
<rect x="1080" y="370" width="300" height="120" rx="18" class="box"/><text x="1105" y="409" class="head">Simulated merchants</text><text x="1105" y="439" class="body">Northstar refund / Forma warranty</text><text x="1105" y="463" class="body">No real messages or money</text><path d="M1230 300V365" class="line"/>
<rect x="710" y="370" width="300" height="120" rx="18" class="box"/><text x="735" y="409" class="head">SQLite + evidence trail</text><text x="735" y="439" class="body">Case state · source hashes</text><text x="735" y="463" class="body">Actor / action / timestamp / hash</text><path d="M1080 430H1015" class="line"/>
<rect x="370" y="370" width="280" height="120" rx="18" fill="#faf1df" stroke="#e6d5ae" stroke-width="2"/><text x="395" y="409" class="head">Human decision endpoint</text><text x="395" y="439" class="body">Current decision ID + consent</text><text x="395" y="463" class="body">Not exposed as an agent tool</text><path d="M510 300V365M650 430H705" class="line"/>
<rect x="60" y="370" width="250" height="120" rx="18" fill="#faf1df" stroke="#e6d5ae" stroke-width="2"/><text x="85" y="409" class="head">$528 shortfall</text><text x="85" y="439" class="body">Challenge or review settlement</text><text x="85" y="463" class="body">The agent waits for you</text><path d="M185 370V305M310 430H365" class="line"/>
<path d="M60 550H1380" stroke="#dce5d3"/><text x="60" y="597" class="cap">VERIFIED AGENTCORE DEPLOYMENT · SEPTEMBER 14, 2026</text>
<rect x="60" y="625" width="1320" height="150" rx="18" fill="#edf2e4" stroke="#d5dfc7" stroke-dasharray="7 5"/><text x="90" y="666" class="head">AgentCore Runtime · READY · us-east-1</text><text x="90" y="696" class="body">Signed synthetic invocation returned HTTP 200 and paused for the human decision.</text><text x="90" y="730" class="body">Future production adapters: authenticated API → durable DynamoDB state / outbox → S3 evidence → scheduled checks → authorized merchant APIs.</text><text x="60" y="815" class="sub">Implemented locally + verified AgentCore backend · Proposed cloud persistence · Synthetic evidence</text>
</svg>
